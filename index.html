<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b111a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ATC EC-ERC"><link rel="manifest" href="./manifest.webmanifest"><!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ATC LEDA EC-ERC</title><style>body{margin:0;background:#020617;color:#fff;font:18px Arial}.app{max-width:820px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.four{grid-template-columns:repeat(4,1fr)}button,input{box-sizing:border-box;width:100%;font-size:23px;border-radius:12px;border:2px solid #475569;padding:15px;background:#1e293b;color:#fff}input{background:#fff;color:#111827;text-align:center;font-weight:bold}button.sel{background:#0369a1;border-color:#7dd3fc}label{display:block;color:#94a3b8;font-weight:bold;margin-top:12px}.info,.summary{background:#0f172a;padding:13px;border-radius:12px;text-align:center}.summary{background:#082f49;text-align:left}.clear{background:#450a0a;margin-top:12px}.small{font-size:11px;color:#94a3b8;text-align:center}h1{text-align:center;margin:4px;font-size:38px}.sub{text-align:center;color:#94a3b8}.day{background:#f8fafc;color:#0f172a}.day .info{background:#e2e8f0}.day button{background:#e2e8f0;color:#0f172a}.day button.sel{background:#0284c7;color:#fff}.day .summary,.day .clear{color:#fff}@media(max-width:520px){.four{grid-template-columns:1fr 1fr}}.numtarget{outline:3px solid #19a7ff!important}.keypad{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,94vw);background:#101722;border:2px solid #566579;border-radius:18px;padding:12px;z-index:99;box-shadow:0 10px 35px #0009}.keypad.hide{display:none}.keypad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keypad button{font-size:30px;font-weight:800;min-height:58px;border-radius:12px}.keypad .done{background:#19a7ff;color:#00111c}.keypad .del{background:#d25555;color:white}</style><body><div class="app"><h1>EC-ERC</h1><div class="sub">LEDA · LLEIDA</div><div class="grid"><div class="info">TWR <b>121.330</b></div><div class="info">APP <b>127.700</b></div></div><label>PISTA</label><div class="grid"><button data-k="r" data-v="31">31</button><button data-k="r" data-v="13">13</button></div><label>GIRO DE SALIDA</label><div class="grid"><button data-k="t" data-v="IZQUIERDA">← IZQUIERDA</button><button data-k="t" data-v="DERECHA">DERECHA →</button></div><div class="grid"><div><label>QNH</label><input id="q" readonly inputmode="numeric" maxlength="4" placeholder="1013"></div><div><label>TRANSPONDER</label><input id="x" readonly inputmode="numeric" maxlength="4" placeholder="7000"></div></div><label>PUNTO SALIDA / ENTRADA</label><div class="grid four"><button data-k="p" data-v="N">N<br><small>012°/192°</small></button><button data-k="p" data-v="E">E<br><small>078°/258°</small></button><button data-k="p" data-v="S">S<br><small>197°/017°</small></button><button data-k="p" data-v="SW">SW<br><small>252°/072°</small></button></div><div class="grid"><div><label>VIENTO</label><input id="w" readonly inputmode="numeric" maxlength="6" placeholder="310/08"></div><div><label>ALTURA SOBRE EL TERRENO</label><input id="a" readonly inputmode="numeric" placeholder="1000 ft AGL"></div></div><div class="grid"><div><label>TRÁFICO</label><input id="f" placeholder="C172 final"></div></div><label>NOTAS / INSTRUCCIONES ATC</label><input id="n" placeholder="Espera, autorización..."><div class="grid"><button id="theme">☀ / ☾ MODO</button><button id="timer">⏱ CRONO 00:00</button></div><div class="summary" id="s"><b>ATC:</b> listo.</div><button class="clear" id="save">GUARDAR AUTORIZACIÓN</button><button class="clear" id="c">BORRAR PARA NUEVO VUELO</button><div id="hist"></div><p class="small">Ayuda de anotación. Verifica siempre datos, frecuencias y procedimientos con documentación aeronáutica vigente e instrucciones ATC.</p></div><div id="pad" class="keypad hide"><div class="keys"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button class="del" data-n="del">⌫</button><button data-n="0">0</button><button class="done" data-n="ok">OK</button></div></div><script>const st={r:'',t:'',p:''};const $=x=>document.getElementById(x),els=['q','x','w','a','f','n'];function txt(){let z=[];if(st.r)z.push('PISTA '+st.r);if($('q').value)z.push('QNH '+$('q').value);if(st.t)z.push('GIRO '+st.t.toLowerCase());if($('a').value)z.push('ALTURA AGL '+$('a').value.replace(/\s*ft.*$/i,'')+' ft');if(st.p)z.push('SALIDA '+({N:'NOVEMBER',E:'ECHO',S:'SIERRA',SW:'SIERRA WHISKEY'}[st.p]||st.p));if($('x').value)z.push('TRANSPONDER '+$('x').value);return z.join(' · ')}function u(){$('s').innerHTML='<b>ATC:</b> '+(txt()||'listo.')}document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;st[k]=b.dataset.v;document.querySelectorAll('[data-k="'+k+'"]').forEach(v=>v.classList.toggle('sel',v===b));u()});els.forEach(e=>$(e).oninput=u);$('q').oninput=()=>{$('q').value=$('q').value.replace(/\D/g,'').slice(0,4);u()};$('w').oninput=()=>{let d=$('w').value.replace(/\D/g,'').slice(0,5);$('w').value=d.length>3?d.slice(0,3)+'/'+d.slice(3):d;u()};$('x').oninput=()=>{$('x').value=$('x').value.replace(/[^0-7]/g,'').slice(0,4);u()};$('theme').onclick=()=>document.body.classList.toggle('day');let it=0,start=0;$('timer').onclick=()=>{if(it){clearInterval(it);it=0;$('timer').textContent='⏱ CRONO 00:00';return}start=Date.now();it=setInterval(()=>{let d=Math.floor((Date.now()-start)/1000);$('timer').textContent='⏱ CRONO '+String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0')},1000)};$('save').onclick=()=>{let t=txt();if(!t)return;let d=document.createElement('div');d.className='summary';d.style.marginTop='10px';d.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+t;$('hist').prepend(d)};$('c').onclick=()=>{st.r=st.t=st.p='';els.forEach(e=>$(e).value='');document.querySelectorAll('.sel').forEach(b=>b.classList.remove('sel'));u()};
let numTarget=null;
const limits={q:4,a:5,x:4,w:5};
['q','a','x','w'].forEach(id=>{$(id).addEventListener('click',()=>{numTarget=$(id);document.querySelectorAll('.numtarget').forEach(e=>e.classList.remove('numtarget'));numTarget.classList.add('numtarget');$('pad').classList.remove('hide')})});
document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>{if(!numTarget)return;let k=b.dataset.n;if(k==='ok'){$('pad').classList.add('hide');numTarget.classList.remove('numtarget');numTarget=null;return}if(k==='del'){let raw=numTarget.id==='w'?numTarget.value.replace(/\D/g,''):numTarget.value;raw=raw.slice(0,-1);numTarget.value=numTarget.id==='w'&&raw.length>3?raw.slice(0,3)+'/'+raw.slice(3):raw}else{let raw=numTarget.id==='w'?numTarget.value.replace(/\D/g,''):numTarget.value;if(raw.length<(limits[numTarget.id]||5)){raw+=k;numTarget.value=numTarget.id==='w'&&raw.length>3?raw.slice(0,3)+'/'+raw.slice(3):raw}}u()});
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));}</script></body></html>
